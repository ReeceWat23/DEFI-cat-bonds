[profile.default]
src     = "contracts"
out     = "out"
libs    = ["lib"]
test    = "test"
script  = "script"

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# Solidity compiler
solc_version   = "0.8.20"
optimizer      = true
optimizer_runs = 200

# Fuzz testing — run 1000 random inputs per fuzz test
[fuzz]
runs = 1000

# Invariant testing
[invariant]
runs   = 256
depth  = 15
