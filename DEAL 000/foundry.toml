[profile.default]
src     = "src"
script  = "script"
out     = "out"
libs    = ["../lib"]

remappings = [
    "forge-std/=../lib/forge-std/src/",
    "@openzeppelin/=../lib/openzeppelin-contracts/",
    "catbond/=src/catbond/",
]

solc_version   = "0.8.20"
optimizer      = true
optimizer_runs = 200
# CatBond's constructor takes 12 params including a dynamic ExposureRegion[]
# array — enough to hit "stack too deep" under the legacy codegen path.
via_ir         = true
